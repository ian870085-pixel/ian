<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Caveman</title>
  <style>
    :root {
      --sky: #87c7e8;
      --dirt: #b87333;
      --track: #d99b55;
      --stone: #68645d;
      --grass: #4f9b43;
      --cave: #2f2b25;
      --gold: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #2a1d12;
      background:
        radial-gradient(circle at 15% 12%, rgba(255,255,255,.65) 0 4rem, transparent 4.1rem),
        linear-gradient(var(--sky) 0 58%, #6bb95c 58% 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      background: rgba(255, 244, 213, .92);
      border: 8px solid #5d3b21;
      border-radius: 28px;
      box-shadow: 0 18px 0 rgba(65, 39, 18, .28), 0 24px 45px rgba(0,0,0,.24);
      overflow: hidden;
    }

    header {
      padding: 26px 28px 18px;
      text-align: center;
      background: linear-gradient(135deg, #f6c56b, #f19f4d);
      border-bottom: 6px solid #5d3b21;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      letter-spacing: 1px;
      text-shadow: 3px 4px 0 rgba(255,255,255,.35);
    }

    .tagline { margin: 8px 0 0; font-size: 1.1rem; font-weight: 700; }

    .tabs {
      display: flex;
      gap: 10px;
      padding: 18px 28px 0;
      background: #ffe7a0;
    }

    .tab {
      border-radius: 18px 18px 0 0;
      box-shadow: inset 0 -5px 0 rgba(94, 58, 26, .18), 0 4px 0 #5d3b21;
      background: #d5f2a5;
    }

    .tab.active { background: var(--gold); transform: translateY(4px); box-shadow: inset 0 -3px 0 rgba(94, 58, 26, .18); }

    .panel { display: none; padding: 22px 28px; }
    .panel.active { display: block; }

    .controls {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 18px;
      align-items: end;
    }

    label { display: block; font-weight: 800; margin-bottom: 8px; }

    textarea {
      width: 100%;
      min-height: 118px;
      resize: vertical;
      border: 4px solid #5d3b21;
      border-radius: 18px;
      padding: 14px;
      font: 700 1rem/1.35 "Trebuchet MS", Arial, sans-serif;
      background: #fff8df;
      color: #2a1d12;
    }

    .buttons { display: flex; flex-wrap: wrap; gap: 10px; }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 12px;
      border: 3px solid #5d3b21;
      border-radius: 16px;
      background: #fff8df;
      font-weight: 900;
    }

    .option input { width: 22px; height: 22px; accent-color: #8d5524; }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      font: 900 1rem "Trebuchet MS", Arial, sans-serif;
      color: #2a1d12;
      background: var(--gold);
      box-shadow: inset 0 -5px 0 rgba(94, 58, 26, .28), 0 5px 0 #5d3b21;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(3px); box-shadow: inset 0 -3px 0 rgba(94,58,26,.28), 0 2px 0 #5d3b21; }
    button.secondary { background: #bde0fe; }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .race-wrap { padding: 0; }

    .scoreboard {
      min-height: 62px;
      margin-bottom: 16px;
      display: grid;
      place-items: center;
      text-align: center;
      border: 5px dashed #7b4a24;
      border-radius: 20px;
      background: #fff1bd;
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 900;
    }

    .track {
      position: relative;
      min-height: 500px;
      border: 6px solid #5d3b21;
      border-radius: 24px;
      overflow: hidden;
      background:
        linear-gradient(90deg, transparent calc(100% - 86px), rgba(255,255,255,.9) calc(100% - 86px) calc(100% - 76px), transparent calc(100% - 76px)),
        repeating-linear-gradient(0deg, var(--track) 0 72px, #c88645 72px 78px);
    }

    .finish {
      position: absolute;
      top: 0;
      right: 76px;
      bottom: 0;
      width: 10px;
      background: repeating-linear-gradient(0deg, #fff 0 18px, #111 18px 36px);
      z-index: 1;
    }

    .cave {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 126px;
      height: 126px;
      border-radius: 60px 60px 18px 18px;
      background: radial-gradient(ellipse at center bottom, #070604 0 35%, var(--cave) 36% 100%);
      border: 6px solid var(--stone);
      z-index: 2;
    }

    .lane {
      position: relative;
      height: 78px;
      border-bottom: 3px dashed rgba(93,59,33,.42);
    }

    .runner {
      position: absolute;
      left: 8px;
      top: 8px;
      width: 180px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform .08s linear;
      z-index: 3;
    }

    .caveman {
      width: 58px;
      height: 58px;
      position: relative;
      display: grid;
      place-items: center;
      font-size: 42px;
      filter: drop-shadow(2px 4px 0 rgba(0,0,0,.18));
      animation: runBody .26s infinite alternate ease-in-out;
    }

    .runner:nth-child(even) .caveman { animation-delay: -.13s; }

    .caveman::after {
      content: '〰️';
      position: absolute;
      margin-top: 38px;
      margin-left: -38px;
      font-size: 22px;
      animation: dust .28s infinite linear;
      opacity: .55;
    }

    .name {
      max-width: 116px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: rgba(255,255,255,.82);
      border: 3px solid #5d3b21;
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 900;
      box-shadow: 0 3px 0 rgba(93,59,33,.24);
    }

    .winner .name { background: #ffe66d; }
    .winner .caveman { animation: victory .45s infinite alternate ease-in-out; }
    .close-call .name { background: #ffadad; }
    .close-call::after { content: 'slowed!'; font-weight: 900; color: #8b1e1e; }

    .history {
      margin-top: 18px;
      padding: 16px;
      border: 4px solid #5d3b21;
      border-radius: 18px;
      background: #fff8df;
    }

    .history h2 { margin: 0 0 10px; }
    .history ol { margin: 0; padding-left: 24px; font-weight: 800; }

    @keyframes runBody { from { transform: translateY(5px) rotate(-9deg) scaleX(.95); } to { transform: translateY(-5px) rotate(8deg) scaleX(1.05); } }
    @keyframes dust { from { transform: translateX(8px); opacity: .7; } to { transform: translateX(-16px); opacity: .05; } }
    @keyframes victory { from { transform: translateY(0) scale(1.05); } to { transform: translateY(-10px) scale(1.16) rotate(8deg); } }

    @media (max-width: 760px) {
      .controls { grid-template-columns: 1fr; }
      .tabs { flex-wrap: wrap; }
      .buttons { justify-content: center; }
      .track { min-height: 420px; }
      .runner { width: 145px; }
      .name { max-width: 86px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>🦴 The Caveman</h1>
      <p class="tagline">Build your cave crew, jump to the race tab, and watch a dramatic close-call sprint choose the winner.</p>
    </header>

    <nav class="tabs" aria-label="Caveman sections">
      <button class="tab active" data-tab="setupPanel">Setup Cave</button>
      <button class="tab" data-tab="racePanel">Race Track</button>
    </nav>

    <section id="setupPanel" class="panel active" aria-label="Race setup">
      <div class="controls">
        <div>
          <label for="names">Racers (one per line)</label>
          <textarea id="names" spellcheck="false">Gronk
Ugga
Bam-Bam
Pebble
Thunk
Zara</textarea>
          <label class="option" for="removeWinner">
            <input id="removeWinner" type="checkbox" />
            Remove each winner from the next race
          </label>
        </div>
        <div class="buttons">
          <button id="startBtn">Start Race</button>
          <button id="shuffleBtn" class="secondary">Shuffle Names</button>
          <button id="resetBtn" class="secondary">Reset</button>
        </div>
      </div>
      <div class="history">
        <h2>Winners</h2>
        <ol id="winnerList"></ol>
      </div>
    </section>

    <section id="racePanel" class="panel race-wrap" aria-label="Caveman race">
      <div id="scoreboard" class="scoreboard">Ready at the starting rock!</div>
      <div id="track" class="track">
        <div class="finish" aria-hidden="true"></div>
        <div class="cave" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <script>
    const namesInput = document.getElementById('names');
    const startBtn = document.getElementById('startBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scoreboard = document.getElementById('scoreboard');
    const track = document.getElementById('track');
    const removeWinner = document.getElementById('removeWinner');
    const winnerList = document.getElementById('winnerList');
    const tabs = document.querySelectorAll('.tab');
    const panels = document.querySelectorAll('.panel');

    const icons = ['🧔🏽‍♂️', '🧔🏻', '🧔🏾', '👩🏽‍🦱', '👨🏿‍🦱', '🧌', '🦣', '🐒'];
    let animationId;
    let racers = [];
    let racing = false;
    let winners = [];

    function getNames() {
      return namesInput.value
        .split('\n')
        .map(name => name.trim())
        .filter(Boolean)
        .slice(0, 12);
    }

    function buildRace() {
      cancelAnimationFrame(animationId);
      racing = false;
      startBtn.disabled = false;
      track.querySelectorAll('.lane').forEach(lane => lane.remove());

      const names = getNames();
      racers = names.map((name, index) => ({
        name,
        progress: 0,
        speed: 0,
        boost: Math.random() * 0.35,
        element: null,
        index
      }));

      racers.forEach((racer, index) => {
        const lane = document.createElement('div');
        lane.className = 'lane';
        const runner = document.createElement('div');
        runner.className = 'runner';
        const caveman = document.createElement('span');
        caveman.className = 'caveman';
        caveman.textContent = icons[index % icons.length];
        const name = document.createElement('span');
        name.className = 'name';
        name.title = racer.name;
        name.textContent = racer.name;
        runner.append(caveman, name);
        lane.appendChild(runner);
        track.appendChild(lane);
        racer.element = runner;
      });

      scoreboard.textContent = racers.length ? 'Ready at the starting rock!' : 'Add at least one racer to begin.';
    }

    function showTab(panelId) {
      tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.tab === panelId));
      panels.forEach(panel => panel.classList.toggle('active', panel.id === panelId));
    }

    function recordWinner(name) {
      winners.unshift(name);
      winnerList.innerHTML = '';
      winners.forEach((winner, index) => {
        const item = document.createElement('li');
        item.textContent = `${index + 1}. ${winner}`;
        winnerList.appendChild(item);
      });
    }

    function removeWinnerFromNames(name) {
      if (!removeWinner.checked) return;
      const names = getNames();
      const index = names.indexOf(name);
      if (index >= 0) names.splice(index, 1);
      namesInput.value = names.join('\n');
    }

    function startRace() {
      buildRace();
      showTab('racePanel');
      if (!racers.length) return;

      racing = true;
      startBtn.disabled = true;
      scoreboard.textContent = 'The cave crowd roars... GO!';
      const start = performance.now();
      const raceTime = 5200 + Math.random() * 1800;
      const winnerIndex = Math.floor(Math.random() * racers.length);
      const closeCallIndex = racers.length > 1
        ? (winnerIndex + 1 + Math.floor(Math.random() * (racers.length - 1))) % racers.length
        : winnerIndex;
      const finishX = Math.max(120, track.clientWidth - 230);

      function tick(now) {
        const elapsed = now - start;
        const base = Math.min(elapsed / raceTime, 1);

        racers.forEach((racer, index) => {
          const winnerPush = index === winnerIndex ? Math.pow(base, 2.3) * 0.29 : 0;
          const closeCallSurge = index === closeCallIndex && base > 0.56 && base < 0.84 ? 0.24 : 0;
          const closeCallSlowdown = index === closeCallIndex && base >= 0.84 ? (base - 0.84) * 1.9 : 0;
          const wobble = Math.sin(base * 22 + index) * 0.026;
          const randomPace = racer.boost * 0.08;
          racer.progress = Math.min(1, base * (0.76 + randomPace) + winnerPush + closeCallSurge - closeCallSlowdown + wobble);

          racer.element.classList.toggle('close-call', index === closeCallIndex && base > 0.8 && base < 0.96);

          if (base > 0.9 && index !== winnerIndex) {
            racer.progress = Math.min(racer.progress, 0.88 + Math.random() * 0.07);
          }

          if (index === winnerIndex && base > 0.96) racer.progress = 1;
          racer.element.style.transform = `translateX(${racer.progress * finishX}px)`;
        });

        if (base < 1) {
          animationId = requestAnimationFrame(tick);
        } else {
          const winner = racers[winnerIndex];
          winner.element.classList.add('winner');
          scoreboard.textContent = `🏆 ${winner.name} wins the cave race! ${removeWinner.checked ? 'They head to the winner cave and leave the next race.' : 'They stay in for another round.'}`;
          recordWinner(winner.name);
          removeWinnerFromNames(winner.name);
          racing = false;
          startBtn.disabled = false;
        }
      }

      animationId = requestAnimationFrame(tick);
    }

    function shuffleNames() {
      const names = getNames();
      for (let i = names.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [names[i], names[j]] = [names[j], names[i]];
      }
      namesInput.value = names.join('\n');
      buildRace();
    }

    tabs.forEach(tab => tab.addEventListener('click', () => showTab(tab.dataset.tab)));
    startBtn.addEventListener('click', startRace);
    shuffleBtn.addEventListener('click', shuffleNames);
    resetBtn.addEventListener('click', buildRace);
    namesInput.addEventListener('input', () => { if (!racing) buildRace(); });

    buildRace();
  </script>
</body>
</html>
