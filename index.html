<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caveman Race Picker</title>
  <style>
    :root {
      --sky: #87c7e8;
      --dirt: #b87333;
      --track: #d99b55;
      --stone: #68645d;
      --grass: #4f9b43;
      --cave: #2f2b25;
      --gold: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #2a1d12;
      background:
        radial-gradient(circle at 15% 12%, rgba(255,255,255,.65) 0 4rem, transparent 4.1rem),
        linear-gradient(var(--sky) 0 58%, #6bb95c 58% 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      background: rgba(255, 244, 213, .92);
      border: 8px solid #5d3b21;
      border-radius: 28px;
      box-shadow: 0 18px 0 rgba(65, 39, 18, .28), 0 24px 45px rgba(0,0,0,.24);
      overflow: hidden;
    }

    header {
      padding: 26px 28px 18px;
      text-align: center;
      background: linear-gradient(135deg, #f6c56b, #f19f4d);
      border-bottom: 6px solid #5d3b21;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      letter-spacing: 1px;
      text-shadow: 3px 4px 0 rgba(255,255,255,.35);
    }

    .tagline { margin: 8px 0 0; font-size: 1.1rem; font-weight: 700; }

    .controls {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 18px;
      padding: 22px 28px;
      align-items: end;
    }

    label { display: block; font-weight: 800; margin-bottom: 8px; }

    textarea {
      width: 100%;
      min-height: 118px;
      resize: vertical;
      border: 4px solid #5d3b21;
      border-radius: 18px;
      padding: 14px;
      font: 700 1rem/1.35 "Trebuchet MS", Arial, sans-serif;
      background: #fff8df;
      color: #2a1d12;
    }

    .buttons { display: flex; flex-wrap: wrap; gap: 10px; }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      font: 900 1rem "Trebuchet MS", Arial, sans-serif;
      color: #2a1d12;
      background: var(--gold);
      box-shadow: inset 0 -5px 0 rgba(94, 58, 26, .28), 0 5px 0 #5d3b21;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(3px); box-shadow: inset 0 -3px 0 rgba(94,58,26,.28), 0 2px 0 #5d3b21; }
    button.secondary { background: #bde0fe; }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .race-wrap { padding: 8px 28px 28px; }

    .scoreboard {
      min-height: 62px;
      margin-bottom: 16px;
      display: grid;
      place-items: center;
      text-align: center;
      border: 5px dashed #7b4a24;
      border-radius: 20px;
      background: #fff1bd;
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 900;
    }

    .track {
      position: relative;
      min-height: 500px;
      border: 6px solid #5d3b21;
      border-radius: 24px;
      overflow: hidden;
      background:
        linear-gradient(90deg, transparent calc(100% - 86px), rgba(255,255,255,.9) calc(100% - 86px) calc(100% - 76px), transparent calc(100% - 76px)),
        repeating-linear-gradient(0deg, var(--track) 0 72px, #c88645 72px 78px);
    }

    .finish {
      position: absolute;
      top: 0;
      right: 76px;
      bottom: 0;
      width: 10px;
      background: repeating-linear-gradient(0deg, #fff 0 18px, #111 18px 36px);
      z-index: 1;
    }

    .cave {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 126px;
      height: 126px;
      border-radius: 60px 60px 18px 18px;
      background: radial-gradient(ellipse at center bottom, #070604 0 35%, var(--cave) 36% 100%);
      border: 6px solid var(--stone);
      z-index: 2;
    }

    .lane {
      position: relative;
      height: 78px;
      border-bottom: 3px dashed rgba(93,59,33,.42);
    }

    .runner {
      position: absolute;
      left: 8px;
      top: 8px;
      width: 180px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform .08s linear;
      z-index: 3;
    }

    .caveman {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      font-size: 42px;
      filter: drop-shadow(2px 4px 0 rgba(0,0,0,.18));
      animation: bob .34s infinite alternate ease-in-out;
    }

    .runner:nth-child(even) .caveman { animation-delay: -.18s; }

    .name {
      max-width: 116px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: rgba(255,255,255,.82);
      border: 3px solid #5d3b21;
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 900;
      box-shadow: 0 3px 0 rgba(93,59,33,.24);
    }

    .winner .name { background: #ffe66d; }
    .winner .caveman { animation: victory .45s infinite alternate ease-in-out; }

    @keyframes bob { from { transform: translateY(4px) rotate(-4deg); } to { transform: translateY(-4px) rotate(5deg); } }
    @keyframes victory { from { transform: translateY(0) scale(1.05); } to { transform: translateY(-10px) scale(1.16) rotate(8deg); } }

    @media (max-width: 760px) {
      .controls { grid-template-columns: 1fr; }
      .buttons { justify-content: center; }
      .track { min-height: 420px; }
      .runner { width: 145px; }
      .name { max-width: 86px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>🦴 Caveman Race Picker</h1>
      <p class="tagline">Add names, start the race, and let the fastest cave person choose your winner.</p>
    </header>

    <section class="controls" aria-label="Race setup">
      <div>
        <label for="names">Racers (one per line)</label>
        <textarea id="names" spellcheck="false">Gronk
Ugga
Bam-Bam
Pebble
Thunk
Zara</textarea>
      </div>
      <div class="buttons">
        <button id="startBtn">Start Race</button>
        <button id="shuffleBtn" class="secondary">Shuffle Names</button>
        <button id="resetBtn" class="secondary">Reset</button>
      </div>
    </section>

    <section class="race-wrap" aria-label="Caveman race">
      <div id="scoreboard" class="scoreboard">Ready at the starting rock!</div>
      <div id="track" class="track">
        <div class="finish" aria-hidden="true"></div>
        <div class="cave" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <script>
    const namesInput = document.getElementById('names');
    const startBtn = document.getElementById('startBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scoreboard = document.getElementById('scoreboard');
    const track = document.getElementById('track');

    const icons = ['🧔🏽‍♂️', '🧔🏻', '🧔🏾', '👩🏽‍🦱', '👨🏿‍🦱', '🧌', '🦣', '🐒'];
    let animationId;
    let racers = [];
    let racing = false;

    function getNames() {
      return namesInput.value
        .split('\n')
        .map(name => name.trim())
        .filter(Boolean)
        .slice(0, 12);
    }

    function buildRace() {
      cancelAnimationFrame(animationId);
      racing = false;
      startBtn.disabled = false;
      track.querySelectorAll('.lane').forEach(lane => lane.remove());

      const names = getNames();
      racers = names.map((name, index) => ({
        name,
        progress: 0,
        speed: 0,
        boost: Math.random() * 0.35,
        element: null,
        index
      }));

      racers.forEach((racer, index) => {
        const lane = document.createElement('div');
        lane.className = 'lane';
        const runner = document.createElement('div');
        runner.className = 'runner';
        runner.innerHTML = `<span class="caveman">${icons[index % icons.length]}</span><span class="name" title="${racer.name}">${racer.name}</span>`;
        lane.appendChild(runner);
        track.appendChild(lane);
        racer.element = runner;
      });

      scoreboard.textContent = racers.length ? 'Ready at the starting rock!' : 'Add at least one racer to begin.';
    }

    function startRace() {
      buildRace();
      if (!racers.length) return;

      racing = true;
      startBtn.disabled = true;
      scoreboard.textContent = 'The cave crowd roars... GO!';
      const start = performance.now();
      const raceTime = 5200 + Math.random() * 1800;
      const winnerIndex = Math.floor(Math.random() * racers.length);
      const finishX = Math.max(120, track.clientWidth - 230);

      function tick(now) {
        const elapsed = now - start;
        const base = Math.min(elapsed / raceTime, 1);

        racers.forEach((racer, index) => {
          const winnerPush = index === winnerIndex ? Math.pow(base, 2.3) * 0.28 : 0;
          const wobble = Math.sin(base * 18 + index) * 0.025;
          const randomPace = racer.boost * 0.08;
          racer.progress = Math.min(1, base * (0.76 + randomPace) + winnerPush + wobble);

          if (base > 0.9 && index !== winnerIndex) {
            racer.progress = Math.min(racer.progress, 0.91 + Math.random() * 0.035);
          }

          if (index === winnerIndex && base > 0.96) racer.progress = 1;
          racer.element.style.transform = `translateX(${racer.progress * finishX}px)`;
        });

        if (base < 1) {
          animationId = requestAnimationFrame(tick);
        } else {
          const winner = racers[winnerIndex];
          winner.element.classList.add('winner');
          scoreboard.textContent = `🏆 ${winner.name} wins the cave race!`;
          racing = false;
          startBtn.disabled = false;
        }
      }

      animationId = requestAnimationFrame(tick);
    }

    function shuffleNames() {
      const names = getNames();
      for (let i = names.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [names[i], names[j]] = [names[j], names[i]];
      }
      namesInput.value = names.join('\n');
      buildRace();
    }

    startBtn.addEventListener('click', startRace);
    shuffleBtn.addEventListener('click', shuffleNames);
    resetBtn.addEventListener('click', buildRace);
    namesInput.addEventListener('input', () => { if (!racing) buildRace(); });

    buildRace();
  </script>
</body>
</html>
